<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        let bill;
        let message = "Please enter your total bill amount";
        do {
            bill = prompt(message);
            if (bill === null || Number(bill) === 0)  {
                message = "Please enter an amount greater than zero ";
            }
            else if (Number(bill) < 0) {
                message = "Negative amounts are not allowed. Please enter a non-negative amount";
            }
            else if (isNaN(Number(bill))) {
                message = "That input is invalid. Please enter the amount as a number";
            }
        } while (bill === null || Number(bill) <= 0 || isNaN(Number(bill)));

        let tip = Number(bill) * 0.10;

        let result = "For a bill of $" + Number(bill).toFixed(2) + ", the tip should be $" + tip.toFixed(2) +".";

        console.log(result);
        document.write(result);

        
    </script>
    
</body>
</html>
